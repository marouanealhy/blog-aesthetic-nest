name: Deploy Aesthetic Nest to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-and-deploy:
    name: Build and Deploy via FTP
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--dns-result-order=ipv4first"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build static site
        run: npm run build

      - name: 🌐 Resolve FTP Server to IPv4
        id: resolve-dns
        run: |
          RAW_SERVER="${{ secrets.FTP_SERVER }}"
          if [ -z "$RAW_SERVER" ]; then
            RAW_SERVER="72.60.93.205"
          fi
          # Force IPv4 lookup (A record) to bypass GitHub runner IPv6 ENETUNREACH issues
          RESOLVED_IP=$(getent ahostsv4 "$RAW_SERVER" | head -n 1 | awk '{print $1}')
          if [ -z "$RESOLVED_IP" ]; then
            RESOLVED_IP="72.60.93.205"
          fi
          echo "Using IPv4 target: $RESOLVED_IP"
          echo "ftp_server=$RESOLVED_IP" >> "$GITHUB_OUTPUT"

      - name: 🔍 Diagnose FTP directory structure
        run: |
          sudo apt-get install -y lftp > /dev/null 2>&1
          SERVER="${{ steps.resolve-dns.outputs.ftp_server }}"
          USER="${{ secrets.FTP_USERNAME }}"
          PASS="${{ secrets.FTP_PASSWORD }}"
          echo "=== FTP Root Directory (pwd + ls) ==="
          lftp -u "$USER","$PASS" ftps://$SERVER <<'LFTP_EOF'
          set ssl:verify-certificate false
          set ftp:ssl-force true
          pwd
          ls
          echo "--- checking if public_html exists ---"
          ls public_html/ 2>/dev/null || echo "(no public_html/ here)"
          quit
          LFTP_EOF

      - name: 🚀 Upload files to Hostinger via lftp
        run: |
          sudo apt-get install -y lftp > /dev/null 2>&1
          SERVER="${{ steps.resolve-dns.outputs.ftp_server }}"
          USER="${{ secrets.FTP_USERNAME }}"
          PASS="${{ secrets.FTP_PASSWORD }}"
          lftp -u "$USER","$PASS" ftps://$SERVER <<LFTP_EOF
          set ssl:verify-certificate false
          set ftp:ssl-force true
          mirror --reverse --delete --verbose ./dist/ ./
          quit
          LFTP_EOF




