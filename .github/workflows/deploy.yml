name: Deploy Aesthetic Nest to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-and-deploy:
    name: Build and Deploy via FTP
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--dns-result-order=ipv4first"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build static site
        run: npm run build

      - name: 🌐 Resolve FTP Server to IPv4
        id: resolve-dns
        run: |
          RAW_SERVER="${{ secrets.FTP_SERVER }}"
          if [ -z "$RAW_SERVER" ]; then
            RAW_SERVER="72.60.93.205"
          fi
          # Force IPv4 lookup (A record) to bypass GitHub runner IPv6 ENETUNREACH issues
          RESOLVED_IP=$(getent ahostsv4 "$RAW_SERVER" | head -n 1 | awk '{print $1}')
          if [ -z "$RESOLVED_IP" ]; then
            RESOLVED_IP="72.60.93.205"
          fi
          echo "Using IPv4 target: $RESOLVED_IP"
          echo "ftp_server=$RESOLVED_IP" >> "$GITHUB_OUTPUT"

      - name: 🧹 Safely remove nested public_html/public_html if present
        env:
          FTP_SERVER: ${{ steps.resolve-dns.outputs.ftp_server }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - << 'PY_EOF'
          import ftplib
          import os
          import ssl
          import sys

          server = os.environ['FTP_SERVER']
          user = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']

          print(f"Connecting to {server} as {user}...")
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          ftps = ftplib.FTP_TLS(context=ctx)
          ftps.connect(server, 21, timeout=30)
          ftps.auth()
          ftps.prot_p()
          ftps.login(user, password)

          initial_pwd = ftps.pwd()
          print(f"Initial FTP working directory: {initial_pwd}")

          def safe_nlst(path=None):
              try:
                  return ftps.nlst(path) if path else ftps.nlst()
              except Exception as e:
                  print(f"nlst error/empty: {e}")
                  return []

          def delete_recursive(dirname):
              print(f"Entering target nested directory: {dirname}")
              ftps.cwd(dirname)
              entries = []
              try:
                  ftps.retrlines('LIST', entries.append)
              except Exception as e:
                  print(f"Error listing {dirname}: {e}")
              for line in entries:
                  parts = line.split(maxsplit=8)
                  if len(parts) < 9:
                      continue
                  name = parts[8]
                  if name in ('.', '..'):
                      continue
                  is_dir = line.startswith('d')
                  if is_dir:
                      delete_recursive(name)
                  else:
                      print(f"  Deleting nested file: {name}")
                      try:
                          ftps.delete(name)
                      except Exception as e:
                          print(f"  Could not delete file {name}: {e}")
              ftps.cwd('..')
              print(f"Removing empty directory: {dirname}")
              try:
                  ftps.rmd(dirname)
              except Exception as e:
                  print(f"Could not remove directory {dirname}: {e}")

          items = safe_nlst()
          print(f"Top-level items: {items}")

          nested_deleted = False

          # Check if we are at root and public_html exists
          if 'public_html' in items and not initial_pwd.rstrip('/').endswith('public_html'):
              print("Inspecting parent public_html/...")
              ftps.cwd('public_html')
              sub_items = safe_nlst()
              print(f"Items inside parent public_html: {sub_items}")
              if 'public_html' in sub_items:
                  print("FOUND nested folder public_html/public_html! Deleting ONLY the nested folder...")
                  delete_recursive('public_html')
                  nested_deleted = True
              else:
                  print("No nested public_html folder found inside parent public_html.")
              ftps.cwd(initial_pwd)
          elif initial_pwd.rstrip('/').endswith('public_html') or ('index.html' in items and 'public_html' in items):
              if 'public_html' in items:
                  print("FOUND nested folder public_html in current directory! Deleting ONLY the nested folder...")
                  delete_recursive('public_html')
                  nested_deleted = True
              else:
                  print("No nested public_html folder found.")
          else:
              print("No public_html folder detected.")

          if nested_deleted:
              print("Nested public_html folder cleanup completed.")
          else:
              print("No nested public_html folder was found to delete.")

          ftps.quit()
          PY_EOF

      - name: 🚀 Sync files to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.resolve-dns.outputs.ftp_server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
