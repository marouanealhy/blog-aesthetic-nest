name: Deploy Aesthetic Nest to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-and-deploy:
    name: Build and Deploy via FTP
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--dns-result-order=ipv4first"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build static site
        run: npm run build

      - name: 🌐 Resolve FTP Server to IPv4
        id: resolve-dns
        run: |
          RAW_SERVER="${{ secrets.FTP_SERVER }}"
          if [ -z "$RAW_SERVER" ]; then
            RAW_SERVER="93.127.179.231"
          fi
          # Force IPv4 lookup (A record) to bypass GitHub runner IPv6 ENETUNREACH issues
          RESOLVED_IP=$(getent ahostsv4 "$RAW_SERVER" | head -n 1 | awk '{print $1}')
          if [ -z "$RESOLVED_IP" ]; then
            RESOLVED_IP="93.127.179.231"
          fi
          echo "Using IPv4 target: $RESOLVED_IP"
          echo "ftp_server=$RESOLVED_IP" >> "$GITHUB_OUTPUT"

      - name: 🚀 Sync files to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.resolve-dns.outputs.ftp_server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**



